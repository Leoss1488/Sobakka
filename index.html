<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2358">
<title>sobakka — случайная песня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d2358;
    --bg-deep: #151a45;
    --card: #28307a;
    --sun: #ffd23f;
    --text: #f4f2ff;
    --muted: #aab0e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Photo */
  .photo {
    width: 188px; height: 188px;
    border-radius: 50%;
    padding: 6px;
    background: conic-gradient(from 0deg, var(--sun), #5c6bff, var(--sun));
    margin-top: 8px;
  }
  .photo.spin { animation: spin 9s linear infinite; }
  .photo-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--card);
    display: grid; place-items: center;
    font-size: 72px;
  }
  .photo.spin .photo-inner { animation: spin 9s linear infinite reverse; }
  .photo-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-family: "Unbounded", "Manrope", sans-serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 24px 0 2px;
  }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }

  /* Now playing */
  .now {
    margin: 26px 0 0;
    min-height: 54px;
  }
  .now .name { font-size: 22px; font-weight: 800; margin: 0; }
  .now .tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--bg-deep);
    background: var(--sun);
    border-radius: 999px;
    padding: 2px 10px;
  }

  /* Buttons */
  button, .link-btn {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 999px;
    color: var(--bg-deep);
    background: var(--sun);
    font-weight: 800;
    font-size: 19px;
    padding: 16px 34px;
    transition: transform .12s ease;
  }
  button:active { transform: scale(.96); }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #start { width: 100%; padding: 22px; font-size: 22px; margin-top: 30px; }
  #again { margin-top: 20px; }
  .ghost {
    background: transparent;
    color: var(--text);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28);
    font-size: 15px;
    padding: 10px 20px;
    text-decoration: none;
    display: inline-block;
    margin-top: 14px;
  }

  /* Player */
  #stage { width: 100%; margin-top: 22px; display: none; }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
  }
  .frame iframe, .frame #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #sc-wrap { display: none; }
  #sc-wrap .frame { aspect-ratio: auto; height: 166px; background: transparent; }

  #note { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 14px; }

  /* Side plaque */
  .plaque {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    background: var(--sun);
    color: var(--bg-deep);
    font-weight: 800;
    font-size: 15px;
    padding: 18px 9px;
    border-radius: 14px 0 0 14px;
    text-decoration: none;
    padding-right: calc(9px + env(safe-area-inset-right));
  }

  @media (prefers-reduced-motion: reduce) {
    .photo.spin, .photo.spin .photo-inner { animation: none; }
  }
</style>
</head>

        fails++;
        if (fails < SONGS.length) next();
        else $('note').textContent = 'Не получилось включить ни одну песню. Проверь интернет.';
      }
    }
  });
}

/* ===== SoundCloud ===== */
function playSc(url) {
  const iframe = $('sc');
  iframe.onload = () => {
    try {
      const w = SC.Widget(iframe);
      w.bind(SC.Widget.Events.PLAY, () => setSpin(true));
      w.bind(SC.Widget.Events.PAUSE, () => setSpin(false));
      w.bind(SC.Widget.Events.FINISH, next);
    } catch (e) {}
  };
  iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
               '&auto_play=true&color=%23ffd23f&show_teaser=false&visual=false';
  $('sc-link').href = url;
}

/* ===== Общая логика ===== */
function setSpin(on) { $('photo').classList.toggle('spin', on); }

function show(i) {
  const s = SONGS[i];
  $('now').innerHTML = '<p class="name"></p><span class="tag"></span>';
  $('now').querySelector('.name').textContent = s.t;
  $('now').querySelector('.tag').textContent = TAG[s.l];

  const isYt = !!s.yt;
  $('yt-wrap').style.display = isYt ? 'block' : 'none';
  $('sc-wrap').style.display = isYt ? 'none' : 'block';

  if (isYt) {
    if ($('sc').src) $('sc').src = 'about:blank';
    if (ytApiReady) playYt(s.yt); else pendingIndex = i;
  } else {
    if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    playSc(s.sc);
  }
}

function next() { show(nextIndex()); }

$('start').addEventListener('click', () => {
  $('start').style.display = 'none';
  $('stage').style.display = 'block';
  next();
});
$('again').addEventListener('click', next);
</script>
</body>
</html>
